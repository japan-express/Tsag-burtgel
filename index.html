<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цаг бүртгэл</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--tx:#eef0f3;--mut:#9aa3af;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--bd:#2a2f38;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--ac);color:#fff}
.big{width:100%;padding:22px;font-size:22px}.g{background:var(--ok)}.r{background:var(--bad)}.l{background:none;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs .a{background:var(--ac);color:#fff}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;text-align:left;border-top:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);border:0}
#qr{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:10px;width:fit-content;margin:8px auto}
.hide{display:none}
</style>
</head>
<body><main>
<h1>⏱ Цаг бүртгэл</h1>
<div id="msg" class="mut"></div>

<div id="login" class="card hide">
  <input id="em" type="email" placeholder="Имэйл" autocomplete="username">
  <input id="pw" type="password" placeholder="Нууц үг" autocomplete="current-password">
  <button style="width:100%" onclick="login()">Нэвтрэх</button>
</div>

<div id="app" class="hide">
  <div class="row card"><div><b id="who"></b><div class="mut" id="stat"></div></div><button class="l" onclick="logout()">Гарах</button></div>
  <div id="tabs" class="tabs hide"><button id="t1" class="a" onclick="tab(1)">Миний цаг</button><button id="t2" onclick="tab(2)">Админ</button></div>
  <div id="v1">
    <div id="confirm" class="card hide"><div id="cq" style="margin-bottom:10px;font-weight:600"></div><button class="big" id="cb" onclick="toggle()"></button></div>
    <button id="mainbtn" class="big" onclick="toggle()"></button>
    <div class="card" style="margin-top:12px"><b>Сүүлийн бүртгэл</b><div class="w" id="mine"></div></div>
  </div>
  <div id="v2" class="hide">
    <div class="card"><div class="row"><input id="mon" type="month" style="margin:0"><button onclick="loadAdmin()">Харах</button><button onclick="csv()">CSV</button></div>
      <div class="w" id="adm" style="margin-top:10px"></div></div>
    <div class="card"><b>Оффисын QR</b><div class="mut">Хэвлээд хаалганы дэргэд байрлуулна. Ажилтан утасны камераар уншуулна.</div><div id="qr"></div></div>
  </div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== Тохиргоо: Supabase → Project Settings → API =====
const SUPABASE_URL="https://mhiqjjcrvhlcbiyygewh.supabase.co";
const SUPABASE_KEY="sb_publishable_IY1_ZQ0J0nw8eowMHtSJSA_lrYxjwsX";
// =======================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=t=>new Date(t).toLocaleTimeString("mn-MN",{hour:"2-digit",minute:"2-digit"});
const dt=t=>new Date(t).toLocaleDateString("mn-MN");
const dur=(a,b)=>{const m=Math.floor(((b?new Date(b):new Date())-new Date(a))/6e4);return Math.floor(m/60)+" ц "+m%60+" мин"};
let me=null,isAdmin=false,open=null,rows=[];
const fromQR=()=>location.hash==="#qr";

function note(t){$("msg").textContent=t||""}
async function login(){
  note("");
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)return note("Нэвтрэхэд алдаа: имэйл эсвэл нууц үг буруу.");
  init();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("login").classList.remove("hide");$("app").classList.add("hide");return}
  $("login").classList.add("hide");$("app").classList.remove("hide");
  const {data:p}=await sb.from("profiles").select("name,role").eq("id",session.user.id).single();
  me=session.user;isAdmin=p?.role==="admin";
  $("who").textContent=p?.name||me.email;
  if(isAdmin){$("tabs").classList.remove("hide");$("mon").value=new Date().toISOString().slice(0,7);
    $("qr").innerHTML="";new QRCode($("qr"),{text:location.origin+location.pathname+"#qr",width:180,height:180})}
  await loadMine();
  if(fromQR()){ // QR уншуулсан: нэг товшилтоор баталгаажуулна
    $("confirm").classList.remove("hide");
    $("cq").textContent=open?"Та одоо явах уу?":"Та одоо ирсэн үү?";
    $("cb").textContent=open?"Явлаа":"Ирлээ";$("cb").className="big "+(open?"r":"g");
  }
}
async function loadMine(){
  const {data,error}=await sb.from("attendance").select("*").eq("user_id",me.id).order("check_in",{ascending:false}).limit(10);
  if(error)return note("Өгөгдөл уншиж чадсангүй.");
  open=data.find(r=>!r.check_out)||null;
  $("stat").textContent=open?"Ирсэн: "+hm(open.check_in):"Одоогоор бүртгэлгүй";
  const b=$("mainbtn");b.textContent=open?"Явлаа":"Ирлээ";b.className="big "+(open?"r":"g");
  $("mine").innerHTML=data.length?"<table><tr><th>Огноо</th><th>Ирсэн</th><th>Явсан</th><th>Нийт</th></tr>"+data.map(r=>`<tr><td>${dt(r.check_in)}</td><td>${hm(r.check_in)}</td><td>${r.check_out?hm(r.check_out):"—"}</td><td>${dur(r.check_in,r.check_out)}</td></tr>`).join("")+"</table>":'<div class="mut">Бүртгэл алга.</div>';
}
async function toggle(){
  note("");
  const {error}=await sb.rpc("toggle_attendance");
  if(error)return note("Бүртгэж чадсангүй. Дахин оролдоно уу.");
  $("confirm").classList.add("hide");history.replaceState(null,"",location.pathname);
  await loadMine();note("✓ Бүртгэгдлээ");
}
function tab(n){$("v1").classList.toggle("hide",n!=1);$("v2").classList.toggle("hide",n!=2);$("t1").className=n==1?"a":"";$("t2").className=n==2?"a":"";if(n==2)loadAdmin()}
async function loadAdmin(){
  const m=$("mon").value,s=new Date(m+"-01"),e=new Date(s.getFullYear(),s.getMonth()+1,1);
  const {data,error}=await sb.from("attendance").select("check_in,check_out,profiles(name)").gte("check_in",s.toISOString()).lt("check_in",e.toISOString()).order("check_in",{ascending:false});
  if(error)return note("Админ өгөгдөл уншиж чадсангүй.");
  rows=data;const tot={};
  data.forEach(r=>{const n=r.profiles?.name||"?";tot[n]=(tot[n]||0)+((r.check_out?new Date(r.check_out):new Date())-new Date(r.check_in))});
  const sum=Object.entries(tot).map(([n,ms])=>`<tr><td>${esc(n)}</td><td>${Math.floor(ms/36e5)} ц ${Math.floor(ms%36e5/6e4)} мин</td></tr>`).join("");
  $("adm").innerHTML=(sum?"<b>Сарын нийт</b><table>"+sum+"</table><br>":"")+"<b>Бүх бүртгэл</b><table><tr><th>Огноо</th><th>Нэр</th><th>Ирсэн</th><th>Явсан</th></tr>"+data.map(r=>`<tr><td>${dt(r.check_in)}</td><td>${esc(r.profiles?.name||"?")}</td><td>${hm(r.check_in)}</td><td>${r.check_out?hm(r.check_out):"—"}</td></tr>`).join("")+"</table>";
}
function csv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const t="\ufeffНэр,Огноо,Ирсэн,Явсан,Минут\n"+rows.map(r=>[r.profiles?.name,dt(r.check_in),hm(r.check_in),r.check_out?hm(r.check_out):"",r.check_out?Math.round((new Date(r.check_out)-new Date(r.check_in))/6e4):""].map(q).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="tsag-"+$("mon").value+".csv";a.click();
}
init();
</script>
</body>
</html>
